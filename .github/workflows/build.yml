name: build

on:
  push:
    branches: [main]
  pull_request:
  # Start a run by hand, for a fork whose pushes do not trigger one, or to
  # re-run the gate without pushing an empty commit.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libcosmic pulls in the system graphics and Wayland stack; without these
      # the build fails at link time with errors that look unrelated to the code.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libudev-dev \
            libinput-dev \
            libseat-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libssl-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # libcosmic is a large git dependency; without a cache every run rebuilds
      # the whole tree.
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked
